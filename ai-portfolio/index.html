<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AI Portfolio Assistant</title>
  <style>
    :root { --accent: #6c5ce7; --accent2: #4a90e2; --bg: #0f1226; --card: #181c3a; --text: #e8eaff; --muted: #9aa0c7; }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: "Segoe UI", Arial, sans-serif; color: var(--text);
           background: radial-gradient(circle at top, #1d2250, var(--bg)); min-height: 100vh; }
    #app { max-width: 760px; margin: 0 auto; padding: 24px 16px; }

    header { display: flex; align-items: center; gap: 14px; margin-bottom: 18px; }
    .avatar { width: 54px; height: 54px; border-radius: 50%; display: grid; place-items: center;
              font-size: 24px; font-weight: 700; background: linear-gradient(135deg, var(--accent), var(--accent2)); }
    header h1 { margin: 0; font-size: 22px; }
    header p { margin: 2px 0 0; color: var(--muted); font-size: 14px; }
    #download { margin-left: auto; display: none; text-decoration: none; color: #fff; font-size: 14px;
                padding: 9px 14px; border-radius: 10px; background: linear-gradient(135deg, var(--accent), var(--accent2)); }
    #download:hover { opacity: 0.9; }

    #quick { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 14px; }
    #quick button { background: transparent; color: var(--text); border: 1px solid #3a4080; font-size: 13px;
                    padding: 7px 14px; border-radius: 20px; cursor: pointer; transition: 0.2s; }
    #quick button:hover { background: var(--accent); border-color: var(--accent); }

    #chat { height: 420px; overflow-y: auto; background: var(--card); border: 1px solid #2a2f63;
            border-radius: 16px; padding: 14px; display: flex; flex-direction: column; gap: 10px; }
    .msg { padding: 10px 14px; border-radius: 14px; max-width: 80%; white-space: pre-wrap; line-height: 1.5; font-size: 15px; }
    .user { align-self: flex-end; background: linear-gradient(135deg, var(--accent), var(--accent2)); color: #fff; border-bottom-right-radius: 4px; }
    .bot { align-self: flex-start; background: #232851; border-bottom-left-radius: 4px; }

    #row { display: flex; gap: 8px; margin-top: 12px; }
    #q { flex: 1; padding: 13px 16px; border-radius: 12px; border: 1px solid #3a4080; background: var(--card);
         color: var(--text); font-size: 15px; outline: none; }
    #q:focus { border-color: var(--accent); }
    #send { padding: 0 22px; border: none; border-radius: 12px; color: #fff; cursor: pointer; font-size: 15px;
            background: linear-gradient(135deg, var(--accent), var(--accent2)); }
    footer { text-align: center; color: var(--muted); font-size: 12px; margin-top: 14px; }

    @media (max-width: 520px) { header { flex-wrap: wrap; } #download { margin-left: 0; } .msg { max-width: 90%; } }
  </style>
</head>
<body>
  <div id="app">
    <header>
      <div class="avatar" id="avatar">?</div>
      <div>
        <h1 id="title">AI Assistant</h1>
        <p>Ask me anything about skills, projects and background</p>
      </div>
      <a id="download" href="/resume/download">⬇ Download Resume</a>
    </header>

    <div id="quick">
      <button data-q="What are their key skills?">Skills</button>
      <button data-q="Tell me about their projects.">Projects</button>
      <button data-q="What is their education background?">Education</button>
      <button data-q="How can I contact them?">Contact</button>
    </div>

    <div id="chat"></div>

    <div id="row">
      <input id="q" placeholder="Type your question..." autofocus>
      <button id="send">Send</button>
    </div>
    <footer id="footer"></footer>
  </div>

  <script>
    let sessionId = localStorage.getItem("sid");
    if (!sessionId) {
      sessionId = crypto.randomUUID();
      localStorage.setItem("sid", sessionId);
    }

    const chatBox = document.getElementById("chat");
    const input = document.getElementById("q");
    const sendBtn = document.getElementById("send");

    function addMsg(text, who) {
      const div = document.createElement("div");
      div.className = "msg " + who;
      div.textContent = text;
      chatBox.appendChild(div);
      chatBox.scrollTop = chatBox.scrollHeight;
      return div;
    }

    async function send(preset) {
      const question = (typeof preset === "string" ? preset : input.value).trim();
      if (!question) return;
      addMsg(question, "user");
      input.value = "";
      const loading = addMsg("Thinking...", "bot");

      try {
        const res = await fetch("/chat", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ question, session_id: sessionId })
        });
        if (!res.ok) {
          loading.textContent = "Server error " + res.status + ": " + (await res.text());
          return;
        }
        const data = await res.json();
        loading.textContent = data.answer;
      } catch (err) {
        loading.textContent = "Server se connect nahi ho paya.";
      }
      chatBox.scrollTop = chatBox.scrollHeight;
    }

    sendBtn.addEventListener("click", () => send());
    input.addEventListener("keydown", (e) => { if (e.key === "Enter") send(); });
    document.querySelectorAll("#quick button").forEach(btn => {
      btn.addEventListener("click", () => send(btn.dataset.q));
    });

    fetch("/profile").then(r => r.json()).then(d => {
      const name = d.name;
      document.title = "Ask " + name + "'s AI";
      document.getElementById("title").textContent = name + "'s AI Assistant";
      document.getElementById("avatar").textContent = name.charAt(0).toUpperCase();
      document.getElementById("footer").textContent = "AI answers are based only on " + name + "'s resume";
      addMsg("Hi! 👋 I'm " + name + "'s AI assistant. Ask me about skills, projects or education.", "bot");
    }).catch(() => addMsg("Hi! Ask me about skills, projects or education.", "bot"));

    fetch("/resume/available").then(r => r.json()).then(d => {
      if (d.available) document.getElementById("download").style.display = "inline-block";
    }).catch(() => {});
  </script>
</body>
</html>
