<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AI Portfolio Assistant</title>
  <style>
    :root {
      --accent: #6c5ce7;
      --accent2: #4a90e2;
      --bg: #0f1226;
      --card: #181c3a;
      --card-bot: #22274e;
      --border: #2a2f63;
      --text: #e8eaff;
      --muted: #9aa0c7;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Segoe UI", -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
      color: var(--text);
      background: radial-gradient(circle at top, #1d2250, var(--bg));
      min-height: 100vh;
    }
    #app {
      max-width: 800px;
      margin: 0 auto;
      padding: 24px 16px;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }

    header {
      display: flex;
      align-items: center;
      gap: 14px;
      margin-bottom: 18px;
    }
    .avatar {
      width: 52px;
      height: 52px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      font-size: 24px;
      font-weight: 700;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      box-shadow: 0 4px 12px rgba(108, 92, 231, 0.35);
      flex-shrink: 0;
    }
    .header-text { flex: 1; }
    header h1 { margin: 0; font-size: 22px; font-weight: 700; }
    header p { margin: 3px 0 0; color: var(--muted); font-size: 13px; }
    
    .header-actions { display: flex; align-items: center; gap: 8px; margin-left: auto; }
    .btn-secondary {
      background: #20254c;
      border: 1px solid var(--border);
      color: var(--text);
      font-size: 13px;
      padding: 8px 12px;
      border-radius: 10px;
      cursor: pointer;
      text-decoration: none;
      transition: background 0.2s, border-color 0.2s;
    }
    .btn-secondary:hover { background: #2c336b; border-color: var(--accent); }

    #download {
      display: none;
      text-decoration: none;
      color: #fff;
      font-size: 13px;
      font-weight: 600;
      padding: 8px 14px;
      border-radius: 10px;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      transition: opacity 0.2s;
    }
    #download:hover { opacity: 0.9; }

    #quick { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 14px; }
    #quick button {
      background: rgba(24, 28, 58, 0.8);
      color: var(--text);
      border: 1px solid #3a4080;
      font-size: 13px;
      padding: 7px 14px;
      border-radius: 20px;
      cursor: pointer;
      transition: background 0.2s, border-color 0.2s, transform 0.1s;
    }
    #quick button:hover {
      background: var(--accent);
      border-color: var(--accent);
      transform: translateY(-1px);
    }

    #chat {
      flex: 1;
      height: 440px;
      min-height: 380px;
      overflow-y: auto;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      scroll-behavior: smooth;
    }
    .msg {
      padding: 12px 16px;
      border-radius: 14px;
      max-width: 82%;
      line-height: 1.55;
      font-size: 14.5px;
      word-break: break-word;
    }
    .msg p { margin: 0 0 6px 0; }
    .msg p:last-child { margin-bottom: 0; }
    .msg ul, .msg ol { margin: 6px 0; padding-left: 20px; }
    .msg li { margin-bottom: 4px; }
    .msg code {
      background: rgba(0, 0, 0, 0.25);
      padding: 2px 5px;
      border-radius: 4px;
      font-family: Consolas, monospace;
      font-size: 13px;
    }
    .user {
      align-self: flex-end;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      color: #fff;
      border-bottom-right-radius: 4px;
    }
    .bot {
      align-self: flex-start;
      background: var(--card-bot);
      border: 1px solid #2e3568;
      border-bottom-left-radius: 4px;
    }
    .loading-dots { display: inline-flex; gap: 4px; align-items: center; }
    .loading-dots span {
      width: 6px; height: 6px; background: var(--muted); border-radius: 50%;
      animation: pulse 1.2s infinite ease-in-out;
    }
    .loading-dots span:nth-child(2) { animation-delay: 0.2s; }
    .loading-dots span:nth-child(3) { animation-delay: 0.4s; }
    @keyframes pulse {
      0%, 80%, 100% { opacity: 0.2; transform: scale(0.8); }
      40% { opacity: 1; transform: scale(1.2); }
    }

    #row { display: flex; gap: 8px; margin-top: 14px; }
    #q {
      flex: 1;
      padding: 13px 16px;
      border-radius: 12px;
      border: 1px solid #3a4080;
      background: var(--card);
      color: var(--text);
      font-size: 15px;
      outline: none;
      transition: border-color 0.2s;
    }
    #q:focus { border-color: var(--accent); }
    #send {
      padding: 0 24px;
      border: none;
      border-radius: 12px;
      color: #fff;
      font-weight: 600;
      cursor: pointer;
      font-size: 15px;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      transition: opacity 0.2s;
    }
    #send:disabled { opacity: 0.5; cursor: not-allowed; }
    footer {
      text-align: center;
      color: var(--muted);
      font-size: 12px;
      margin-top: 14px;
      padding-bottom: 6px;
    }

    @media (max-width: 580px) {
      header { flex-wrap: wrap; }
      .header-actions { margin-left: 0; width: 100%; justify-content: flex-start; }
      .msg { max-width: 92%; }
    }
  </style>
</head>
<body>
  <div id="app">
    <header>
      <div class="avatar" id="avatar">?</div>
      <div class="header-text">
        <h1 id="title">AI Portfolio Assistant</h1>
        <p>Ask anything about background, projects, technical skills & experience</p>
      </div>
      <div class="header-actions">
        <a id="download" href="/resume/download">⬇ Resume</a>
        <button id="resetBtn" class="btn-secondary" title="Clear chat history">↺ Reset</button>
      </div>
    </header>

    <div id="quick">
      <button data-q="What are your key technical skills and expertise?">Skills</button>
      <button data-q="Tell me about the major projects you have built.">Projects</button>
      <button data-q="What is your educational background?">Education</button>
      <button data-q="How can recruiters get in touch with you?">Contact</button>
    </div>

    <div id="chat"></div>

    <div id="row">
      <input id="q" placeholder="Ask a question about experience, projects, or skills..." autofocus>
      <button id="send">Send</button>
    </div>
    <footer id="footer">AI answers are grounded strictly in resume data.</footer>
  </div>

  <script>
    let sessionId = localStorage.getItem("portfolio_sid");
    if (!sessionId) {
      sessionId = (window.crypto && crypto.randomUUID) ? crypto.randomUUID() : "sess_" + Date.now();
      localStorage.setItem("portfolio_sid", sessionId);
    }

    const chatBox = document.getElementById("chat");
    const input = document.getElementById("q");
    const sendBtn = document.getElementById("send");
    const resetBtn = document.getElementById("resetBtn");

    function escapeHtml(text) {
      const map = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' };
      return text.replace(/[&<>"']/g, m => map[m]);
    }

    // Lightweight markdown formatter for bold, code, and bullet lists
    function renderMarkdown(raw) {
      const escaped = escapeHtml(raw);
      const lines = escaped.split('\n');
      let html = '';
      let inList = false;

      for (let line of lines) {
        const trimmed = line.trim();
        if (/^[\*\-]\s+(.*)$/.test(trimmed)) {
          if (!inList) { html += '<ul>'; inList = true; }
          const content = trimmed.replace(/^[\*\-]\s+/, '');
          html += '<li>' + formatInline(content) + '</li>';
        } else if (/^\d+\.\s+(.*)$/.test(trimmed)) {
          if (!inList) { html += '<ol>'; inList = true; }
          const content = trimmed.replace(/^\d+\.\s+/, '');
          html += '<li>' + formatInline(content) + '</li>';
        } else {
          if (inList) { html += '</ul>'; inList = false; }
          if (trimmed.length > 0) {
            html += '<p>' + formatInline(line) + '</p>';
          } else {
            html += '<br>';
          }
        }
      }
      if (inList) html += '</ul>';
      return html;
    }

    function formatInline(str) {
      return str
        .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')
        .replace(/\*(.*?)\*/g, '<em>$1</em>')
        .replace(/`([^`]+)`/g, '<code>$1</code>');
    }

    function addMsg(content, who, isHtml = false) {
      const div = document.createElement("div");
      div.className = "msg " + who;
      if (isHtml) {
        div.innerHTML = content;
      } else {
        div.innerHTML = renderMarkdown(content);
      }
      chatBox.appendChild(div);
      chatBox.scrollTop = chatBox.scrollHeight;
      return div;
    }

    async function send(preset) {
      const question = (typeof preset === "string" ? preset : input.value).trim();
      if (!question || sendBtn.disabled) return;

      addMsg(question, "user");
      input.value = "";
      input.disabled = true;
      sendBtn.disabled = true;

      const loadingDiv = document.createElement("div");
      loadingDiv.className = "msg bot";
      loadingDiv.innerHTML = '<span class="loading-dots"><span></span><span></span><span></span></span>';
      chatBox.appendChild(loadingDiv);
      chatBox.scrollTop = chatBox.scrollHeight;

      try {
        const res = await fetch("/chat", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ question, session_id: sessionId })
        });
        
        if (!res.ok) {
          const errDetail = await res.text();
          loadingDiv.innerHTML = '<span style="color:#ff6b81;">Error (' + res.status + '): ' + escapeHtml(errDetail) + '</span>';
          return;
        }

        const data = await res.json();
        loadingDiv.innerHTML = renderMarkdown(data.answer);
      } catch (err) {
        loadingDiv.innerHTML = '<span style="color:#ff6b81;">Could not connect to the server. Please check your backend connection.</span>';
      } finally {
        input.disabled = false;
        sendBtn.disabled = false;
        input.focus();
        chatBox.scrollTop = chatBox.scrollHeight;
      }
    }

    sendBtn.addEventListener("click", () => send());
    input.addEventListener("keydown", (e) => { if (e.key === "Enter") send(); });

    document.querySelectorAll("#quick button").forEach(btn => {
      btn.addEventListener("click", () => send(btn.dataset.q));
    });

    resetBtn.addEventListener("click", async () => {
      sessionId = (window.crypto && crypto.randomUUID) ? crypto.randomUUID() : "sess_" + Date.now();
      localStorage.setItem("portfolio_sid", sessionId);
      try {
        await fetch("/chat/reset", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ session_id: sessionId })
        });
      } catch (e) {}
      chatBox.innerHTML = "";
      initGreeting();
    });

    function initGreeting() {
      fetch("/profile")
        .then(r => r.json())
        .then(d => {
          const name = d.name || "Candidate";
          document.title = name + " - AI Portfolio";
          document.getElementById("title").textContent = name + "'s AI Assistant";
          document.getElementById("avatar").textContent = name.charAt(0).toUpperCase();
          document.getElementById("footer").textContent = "AI answers are grounded strictly in " + name + "'s resume.";
          addMsg("Hi! 👋 I'm **" + name + "'s AI Assistant**. Ask me about skills, projects, background, or select one of the quick options above!", "bot");
        })
        .catch(() => {
          addMsg("Hi! 👋 Welcome. Ask me about technical skills, projects, or background.", "bot");
        });
    }

    initGreeting();

    fetch("/resume/available")
      .then(r => r.json())
      .then(d => {
        if (d.available) {
          document.getElementById("download").style.display = "inline-flex";
        }
      })
      .catch(() => {});
  </script>
</body>
</html>
